[project]
name = "paul-graham-essays-rss"
version = "2.0.0"
description = "Safe RSS 2.0 generator and updater for Paul Graham's essays index"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
