[project]
name = "paul-graham-essay-feeds"
dynamic = ["version"]
description = "Unofficial multi-format metadata feeds for Paul Graham's essays"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wyatt" }]
keywords = ["paul-graham", "essays", "rss", "atom", "json-feed", "syndication"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Communications",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "tqdm>=4.69.0",
    "typer>=0.27.0",
]

[project.scripts]
pg-essay-feeds = "paul_graham_essay_feeds.cli:main"

[project.urls]
Homepage = "https://github.com/wyattowalsh/paul-graham-essay-feeds"
Source = "https://github.com/wyattowalsh/paul-graham-essay-feeds"
Issues = "https://github.com/wyattowalsh/paul-graham-essay-feeds/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "respx>=0.23.1",
  "ruff>=0.15.22",
  "ty>=0.0.60",
]

[tool.uv]
package = true

[tool.hatch.version]
path = "src/paul_graham_essay_feeds/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/paul_graham_essay_feeds"]

# Sdist omits generated feeds + CI/venv/build dirs. git+uvx still clones the
# full repo (feeds present for local use); installed packages write feeds/ at runtime.
[tool.hatch.build.targets.sdist]
exclude = [
  "/feeds",
  "/.github",
  "/.venv",
  "/dist",
]

[tool.pytest.ini_options]
# Default: offline unit + integration + e2e + smoke. Opt in: pytest -m live
addopts = [
  "-ra",
  "--strict-markers",
  "-m",
  "not live",
  "--cov=paul_graham_essay_feeds",
  "--cov-report=term-missing",
  "--cov-fail-under=90",
]
testpaths = ["tests"]
markers = [
  "unit: pure unit tests for one module",
  "integration: multi-module or local HTTP server (no public network)",
  "e2e: full CLI path offline",
  "smoke: subprocess / entrypoint smoke",
  "live: hits paulgraham.com (opt-in only)",
]

[tool.coverage.run]
branch = true
source = ["paul_graham_essay_feeds"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_empty = true
fail_under = 90

[tool.ruff]
target-version = "py313"
line-length = 100
# Notebook cells re-import stdlib on purpose; skip lint/format noise on notebook.ipynb
extend-exclude = ["notebook.ipynb"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.environment]
python-version = "3.13"

# Notebook cells re-import / use Colab; skip type-check noise (mirrors ruff exclude).
[tool.ty.src]
exclude = ["notebook.ipynb"]
