name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: paul-graham-essay-feeds

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - name: Sync
        run: uv sync --locked --all-groups

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest

      - name: Fixture build + check
        run: |
          uv run pg-essay-feeds update \
            --source-file fixtures/articles-2026-07-11.fragment.html \
            --public-base-url https://paul-graham-essay-feeds.vercel.app/ \
            --force
          uv run pg-essay-feeds check \
            --public-base-url https://paul-graham-essay-feeds.vercel.app/
          bash scripts/assemble_public.sh
