name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5

      - name: Sync
        run: uv sync --locked --all-groups

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest

      - name: Offline pipeline smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          from tests.html_samples import synthetic_index_html
          Path("articles.html").write_text(synthetic_index_html(), encoding="utf-8")
          PY
          uv run pg-essay-feeds update --source-file articles.html --force
          uv run pg-essay-feeds check
          mkdir -p public/feeds
          cp feeds/rss.xml feeds/atom.xml feeds/feed.json feeds/subscriptions.opml public/feeds/
