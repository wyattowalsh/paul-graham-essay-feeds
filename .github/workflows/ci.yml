name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Sync
        run: uv sync --locked --all-groups

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest --cov-report=xml:coverage.xml

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

      - name: Check committed feeds
        run: uv run pg-essay-feeds check --quiet

      - name: Offline pipeline smoke
        run: |
          ROOT="${RUNNER_TEMP}/pg-smoke"
          mkdir -p "$ROOT"
          uv run python -c "
          from pathlib import Path
          from tests.html_samples import synthetic_index_html
          Path('${ROOT}/articles.html').write_text(synthetic_index_html(), encoding='utf-8')
          "
          uv run pg-essay-feeds update --repo-root "$ROOT" --quiet --no-enrich \
            --source-file "$ROOT/articles.html"
          uv run pg-essay-feeds check --repo-root "$ROOT" --quiet
          test -f "$ROOT/feeds/rss.xml"
          test -f "$ROOT/feeds/atom.xml"
          test -f "$ROOT/feeds/feed.json"
