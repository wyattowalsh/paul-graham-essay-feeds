name: Update feeds

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: feed-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Sync
        run: uv sync --locked --all-groups

      - name: Update feeds
        env:
          # Keep enrich on for quality snapshots; cap concurrency for site politeness.
          PG_ESSAY_FEEDS_ENRICH_WORKERS: "4"
          PG_ESSAY_FEEDS_LINK_WORKERS: "4"
        run: uv run pg-essay-feeds update

      - name: Validate feeds
        run: uv run pg-essay-feeds check

      - name: Open or update automation PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- feeds; then
            echo "No feed changes."
            exit 0
          fi
          branch="automation/feed-update"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin "$branch" 2>/dev/null || true
          if git rev-parse --verify "refs/remotes/origin/$branch" >/dev/null 2>&1; then
            expect="$(git rev-parse "refs/remotes/origin/$branch")"
          else
            expect=""
          fi
          # Branch from current HEAD so updated feeds stay in the worktree (not reset).
          git checkout -B "$branch"
          git add feeds
          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi
          git commit -m "chore: refresh Paul Graham essay feeds"
          if [ -n "$expect" ]; then
            git push origin "HEAD:refs/heads/$branch" \
              --force-with-lease="refs/heads/$branch:${expect}"
          else
            git push -u origin "HEAD:refs/heads/$branch"
          fi
          if gh pr list --head "$branch" --json number --jq 'length' | grep -qx 0; then
            gh pr create \
              --title "chore: refresh Paul Graham essay feeds" \
              --body "$(printf '%s\n' \
                'Automated feed snapshot update from the official essays index (local files under `feeds/` only).' \
                '' \
                'Validated by `pg-essay-feeds check` (structure + item floor) before opening this PR.' \
                '' \
                'Enrichment ran with capped workers (`PG_ESSAY_FEEDS_ENRICH_WORKERS=4`) for politeness toward paulgraham.com — expect a longer job than a no-enrich run, in exchange for higher-quality short summaries in the snapshot.')" \
              --base main \
              --head "$branch"
          else
            echo "PR already open for $branch"
          fi
