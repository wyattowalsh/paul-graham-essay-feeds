name: Update feeds

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: feed-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      action: ${{ steps.update.outputs.action }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Sync
        run: uv sync --locked --all-groups

      - name: Update feeds
        id: update
        env:
          # Keep enrich on for quality snapshots; cap concurrency for host politeness.
          PG_ESSAY_FEEDS_ENRICH_WORKERS: "4"
          PG_ESSAY_FEEDS_LINK_WORKERS: "4"
          # Daily no-op budget: avoid day-31 mass re-fetch when index is unchanged.
          PG_ESSAY_FEEDS_STALE_AFTER_DAYS: "90"
        run: uv run pg-essay-feeds update --quiet

      - name: Upload workspace when updated
        if: steps.update.outputs.action == 'updated'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: feed-update-workspace
          path: |
            feeds
            catalog.json
          if-no-files-found: error

  publish:
    needs: update
    if: needs.update.outputs.action == 'updated'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download updated workspace
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: feed-update-workspace

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Sync
        run: uv sync --locked --all-groups

      - name: Validate feeds
        run: uv run pg-essay-feeds check

      - name: Commit feeds to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- feeds catalog.json; then
            echo "No feed/catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          expect="${GITHUB_SHA}"
          git add feeds catalog.json
          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi
          git commit -m "chore: refresh Paul Graham essay feeds"
          git push origin "HEAD:refs/heads/main" \
            --force-with-lease="refs/heads/main:${expect}"
