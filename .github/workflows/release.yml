name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Sync
        run: uv sync --locked --all-groups

      - name: Assert tag matches package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(uv run python -c 'from paul_graham_essay_feeds import __version__; print(__version__)')"
          expected="v${version}"
          if [[ "$tag" != "$expected" ]]; then
            echo "::error::Release tag '${tag}' must equal '${expected}' (from __version__)"
            exit 1
          fi
          echo "Tag ${tag} matches package version ${version}"

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest

      - name: Check committed feeds
        run: uv run pg-essay-feeds check --quiet

  build:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Build
        run: uv build --no-sources

      - name: Wheel smoke
        run: |
          set -euo pipefail
          wheel="$(echo dist/*.whl)"
          test -f "$wheel"
          uv run --isolated --no-project --with "$wheel" pg-essay-feeds --help

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download dist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist

      - name: GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
