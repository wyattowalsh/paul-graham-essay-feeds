name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require tagged commit is an ancestor of origin/main
        run: |
          set -euo pipefail
          git fetch origin main --filter=blob:none
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: false

      - name: Sync
        run: uv sync --locked --all-groups

      - name: Assert tag matches package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(uv run python -c 'from paul_graham_essay_feeds import __version__; print(__version__)')"
          expected="v${version}"
          if [[ "$tag" != "$expected" ]]; then
            echo "::error::Release tag '${tag}' must equal '${expected}' (from __version__)"
            exit 1
          fi
          echo "Tag ${tag} matches package version ${version}"

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest --cov-fail-under=90 --cov-report=xml:coverage.xml

      - name: Fail if coverage.xml raw ratio is below 0.90
        run: uv run python -m tests.coverage_xml coverage.xml

      - name: Check committed feeds
        run: |
          set -euo pipefail
          uv run pg-essay-feeds check --quiet
          test -f feeds/rss.xml
          test -f feeds/atom.xml
          test -f feeds/feed.json
          test -f feeds/rss.simple.xml
          test -f feeds/atom.simple.xml
          test -f feeds/feed.simple.json
          test ! -d feeds/validated

      - name: Assert feed format contracts
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          from __future__ import annotations

          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ATOM_NS = "http://www.w3.org/2005/Atom"
          JSON_FEED_VERSION = "https://jsonfeed.org/version/1.1"

          def local_name(tag: str) -> str:
              return tag.split("}", 1)[-1]

          def assert_rss(path: Path) -> None:
              root = ET.parse(path).getroot()
              assert local_name(root.tag) == "rss", f"{path}: root tag {root.tag!r}"
              assert root.get("version") == "2.0", f"{path}: version {root.get('version')!r}"
              channels = [child for child in root if local_name(child.tag) == "channel"]
              assert len(channels) == 1, f"{path}: expected 1 channel, got {len(channels)}"

          def assert_atom(path: Path) -> None:
              root = ET.parse(path).getroot()
              if not root.tag.startswith("{"):
                  raise AssertionError(f"{path}: Atom root missing namespace: {root.tag!r}")
              ns, local = root.tag[1:].split("}", 1)
              assert ns == ATOM_NS, f"{path}: default ns {ns!r}"
              assert local == "feed", f"{path}: root {local!r}"
              for name in ("id", "title", "updated"):
                  el = root.find(f"{{{ATOM_NS}}}{name}")
                  assert el is not None, f"{path}: missing {name}"
                  assert (el.text or "").strip(), f"{path}: empty {name}"

          def assert_json_feed(path: Path) -> None:
              payload = json.loads(path.read_text(encoding="utf-8"))
              assert payload.get("version") == JSON_FEED_VERSION, (
                  f"{path}: version {payload.get('version')!r}"
              )
              title = payload.get("title")
              assert isinstance(title, str) and title.strip(), f"{path}: title"
              assert isinstance(payload.get("items"), list), f"{path}: items must be a list"

          assert_rss(Path("feeds/rss.xml"))
          assert_rss(Path("feeds/rss.simple.xml"))
          assert_atom(Path("feeds/atom.xml"))
          assert_atom(Path("feeds/atom.simple.xml"))
          assert_json_feed(Path("feeds/feed.json"))
          assert_json_feed(Path("feeds/feed.simple.json"))
          PY

      - name: Offline pipeline smoke
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/pg-smoke"
          mkdir -p "$ROOT"
          uv run python -c "
          from pathlib import Path
          from tests.html_samples import synthetic_index_html
          Path('${ROOT}/articles.html').write_text(synthetic_index_html(), encoding='utf-8')
          "
          uv run pg-essay-feeds update --repo-root "$ROOT" --quiet --no-enrich \
            --no-validate-links --source-file "$ROOT/articles.html"
          uv run pg-essay-feeds check --repo-root "$ROOT" --quiet
          test -f "$ROOT/feeds/rss.xml"
          test -f "$ROOT/feeds/atom.xml"
          test -f "$ROOT/feeds/feed.json"
          test -f "$ROOT/feeds/rss.simple.xml"
          test -f "$ROOT/feeds/atom.simple.xml"
          test -f "$ROOT/feeds/feed.simple.json"
          test ! -d "$ROOT/feeds/validated"
          test -f "$ROOT/catalog.json"
          test ! -d "$ROOT/state/generations"
          test ! -f "$ROOT/state/current.json"
          test ! -d "$ROOT/site"

  build:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.0"
          enable-cache: false
          python-version: "3.13"

      - name: Build
        run: uv build --no-sources

      - name: Wheel contains py.typed
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile, pathlib
          wheels = list(pathlib.Path("dist").glob("*.whl"))
          assert wheels, "no wheel"
          with zipfile.ZipFile(wheels[0]) as zf:
              assert "paul_graham_essay_feeds/py.typed" in zf.namelist()
          print("ok", wheels[0].name)
          PY

      - name: Wheel smoke
        run: |
          set -euo pipefail
          wheel="$(echo dist/*.whl)"
          test -f "$wheel"
          uv run --isolated --no-project --with "$wheel" pg-essay-feeds --help

      - name: Sdist smoke
        run: |
          set -euo pipefail
          sdist="$(echo dist/*.tar.gz)"
          test -f "$sdist"
          uv run --isolated --no-project --with "$sdist" pg-essay-feeds --help

      - name: CycloneDX SBOM from lock
        run: |
          set -euo pipefail
          uv export --frozen --no-dev --no-hashes --no-annotate -o dist/requirements.txt
          uv run python - <<'PY'
          import json
          from pathlib import Path
          reqs = []
          for line in Path("dist/requirements.txt").read_text(encoding="utf-8").splitlines():
              text = line.strip()
              if not text or text.startswith("#") or text.startswith("-"):
                  continue
              reqs.append(text)
          bom = {
              "bomFormat": "CycloneDX",
              "specVersion": "1.5",
              "version": 1,
              "metadata": {
                  "component": {
                      "type": "library",
                      "name": "paul-graham-essay-feeds",
                      "version": "1.0.0",
                  }
              },
              "components": [
                  {"type": "library", "name": row.split("==")[0], "version": row}
                  for row in reqs
              ],
          }
          Path("dist/bom.cdx.json").write_text(json.dumps(bom, indent=2) + "\n", encoding="utf-8")
          print("wrote dist/bom.cdx.json", len(reqs), "components")
          PY

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
