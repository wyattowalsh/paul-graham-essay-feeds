name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # GITHUB_TOKEN bot pushes from Update feeds do not fire on.push.
  # Follow the product SHA from product-identity, never workflow_run.head_sha
  # (that is the pre-push source commit).
  workflow_run:
    workflows: ["Update feeds"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    steps:
      - name: Download product identity
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: product-identity
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/product-identity

      - name: Resolve checkout SHA
        id: identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            product_sha="$(python3 -c 'import json, os; from pathlib import Path; p = Path(os.environ["RUNNER_TEMP"]) / "product-identity" / "product-identity.json"; print(json.loads(p.read_text(encoding="utf-8"))["product_sha"])')"
          else
            product_sha="${PUSH_SHA}"
          fi
          case "${product_sha}" in
            main|HEAD|refs/heads/main|refs/heads/master)
              echo "::error::product_sha must not be a mutable branch name: ${product_sha}"
              exit 1
              ;;
          esac
          if [[ ! "${product_sha}" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "::error::product_sha is not a git object id: ${product_sha}"
            exit 1
          fi
          echo "product_sha=${product_sha}" >> "$GITHUB_OUTPUT"
          echo "Assembling Pages from ${product_sha}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.identity.outputs.product_sha }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true
          python-version: "3.13"

      - name: Sync
        run: uv sync --locked --all-groups

      - name: Assemble Pages artifact
        run: uv run python -m paul_graham_essay_feeds.pages --out _site

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
